# Written by hand (the csolution has one mlops: node, and that describes the
# NPU render layer): the Ethos-U55-256 of the Ensemble E7's M55-HP core, in
# the format `cbuild setup` emits, so that the unchanged create_ai_layer.py
# writes the AI layer of the traffic counter (model/traffic.py) into this
# directory:
#
#   MODEL_FLAVOR=traffic python create_ai_layer.py ai_layer_traffic/cmsis-executorch.cbuild-mlops.yml
#
# cmsis-executorch.cbuild-pack.yml next to it is a link to the solution's lock
# file (create_ai_layer.py reads the ExecuTorch pack version from it).
# RTSS_HP_SRAM_MRAM is the pack's Vela system configuration of the HP core's
# NPU (ensemble_vela.ini): the scratch in the SRAM, the weights in the MRAM.
cbuild-mlops:
  description: YOLO26n vehicle detector of the traffic counter for the Ethos-U55 of the M55-HP
  processor:
    type: Cortex-M55
  npu:
    type: Ethos-U55
    macs: 256
  vela:
    ini: ../.cmsis/ensemble_vela.ini
    options: --accelerator-config ethos-u55-256 --system-config RTSS_HP_SRAM_MRAM --memory-mode Shared_Sram
  model:
    clayer: ai_layer.clayer.yml
    name: TrafficVehicles
