#
# Traffic counter with Ultralytics YOLO26n on the Ethos-U55 of the Alif
# Ensemble E7 (Cortex-M55 HP core, AppKit-E7): the vehicles the camera sees
# are detected on the NPU (model/traffic.py, YOLO26n without attention
# fine-tuned on vehicles; the CPU thresholds the scores and decodes the
# boxes, and with the attention of the COCO-pretrained YOLO26n it also runs
# that between three NPU methods), followed from frame to frame
# by a small tracker and counted, per class and direction, as they cross a
# line on the picture; the panel shows the picture, the boxes, the line and
# the tallies. SDS records and plays back the model input. See
# documentation/traffic-counter.md.
#
# Before the first build:
#   MODEL_FLAVOR=traffic python create_ai_layer.py ai_layer_traffic/cmsis-executorch.cbuild-mlops.yml
#   python traffic/make_test_image.py
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations

  # The counting line: TRAFFIC_LINE_POS is its position in input pixels
  # (default: the middle), TRAFFIC_LINE_VERTICAL 1 makes it vertical (left to
  # right traffic) instead of horizontal (top to bottom). A benchmark build
  # (documentation/traffic-counter.md): TRAFFIC_BENCHMARK: 50. Vertical
  # for the Amsterdam crossing (recordings/traffic/youtube_*): its traffic
  # moves twice as far in x as in y and runs below the middle, so over the
  # whole video a vertical line in the middle counts 261 crossings, a
  # horizontal one 29 (traffic/count_playback.py --sweep). The joystick's
  # centre button turns it.
  define:
    # - TRAFFIC_LINE_POS: 208
    - TRAFFIC_LINE_VERTICAL: 1
    # - TRAFFIC_BENCHMARK: 50

  groups:
    - group: App
      optimize: speed
      add-path:
        - ../src
      files:
        - file: ./app_traffic.cpp
        # YOLO26n on the NPU and the rest of its head on the CPU.
        - file: ./detector.cpp
        - file: ./detector.h
        # The attention cores of its two PSA blocks, on the CPU between the
        # NPU methods (model/traffic.py, TRAFFIC_ATTENTION=cpu).
        - file: ./attention.c
        - file: ./attention.h
        # The tracks and the counting line.
        - file: ./tracker.c
        - file: ./tracker.h
        - file: ./joystick.c
        - file: ./joystick.h
        # The Ethos-U driver waits on RTX semaphores, not in a __WFE loop.
        - file: ./ethosu_rtos.c
        # The camera (ARX3A0 RAW8 Bayer, or an MT9M114's RGB565, through the CPI) and the pixel work.
        - file: ./camera.c
        - file: ./camera.h
        - file: ./image.c
        - file: ./image.h
        # SDS recording and playback of the model input and the detections.
        - file: ./rec_play.c
        - file: ./rec_play.h
        - file: ./test_image.c
        - file: ./test_image.h
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading (BSD-3-Clause, see src/LICENSE-ExecuTorch).
        - file: ../src/arm_embedded_module.cpp
        - file: ../src/arm_embedded_module.hpp

  layers:
    - layer: $Traffic-Board-Layer$
      type: Board
    - layer: ../ai_layer_traffic/ai_layer.clayer.yml
      type: AI

  output:
    type:
      - elf
      - hex
      - map
